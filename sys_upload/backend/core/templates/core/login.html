{% extends 'core/base.html' %}
{% load static %}

{% block title %}Entrar - Table Tennis Analyse{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">
                        <i class="fas fa-table-tennis text-primary me-2"></i>
                        Entrar
                    </h2>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input type="text" name="username" id="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" name="password" id="password" class="form-control" placeholder="Digite sua senha" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i> Entrar
                            </button>
                        </div>
                    </form>
                    
                    <hr>
                    
                    <p class="text-center mb-0">
                        Não tem uma conta? 
                        <a href="{% url 'register' %}" class="text-primary">Criar Conta</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
